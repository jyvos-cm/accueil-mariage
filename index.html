<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>ACCUEIL MARIAGE | Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101827;--navy2:#17243a;--navy3:#243650;--gold:#d6b36a;--gold2:#f0d99f;--bg:#f4f1e9;--paper:#fffefa;--ink:#202b3b;--muted:#7d8795;--line:#e9e4d9;--green:#237a56;--red:#b84c4c;--shadow:0 16px 44px #111b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:white;padding:26px 18px;display:flex;flex-direction:column;z-index:5}.brand{padding:4px 10px 28px;border-bottom:1px solid #ffffff1c}.brandmark{font-family:'Playfair Display',serif;color:var(--gold);font-size:23px;letter-spacing:1px}.brand small{display:block;color:#aab4c2;font-size:9px;letter-spacing:2.4px;margin-top:5px}.nav{display:grid;gap:7px;margin-top:25px}.nav button{border:0;background:transparent;color:#c2cad5;text-align:left;padding:13px 14px;border-radius:10px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff12;color:var(--gold2)}.nav button span{display:inline-block;width:27px}.sidebottom{margin-top:auto;color:#8491a2;font-size:11px;line-height:1.7;padding:10px}
.main{margin-left:248px;min-height:100vh}.topbar{height:76px;background:#fffefa;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.userbox{display:flex;align-items:center;gap:12px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#efe3c7;color:#604b25;display:grid;place-items:center;font-weight:800}.content{padding:30px 34px;max-width:1450px;margin:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:#a17d3c;font-weight:800;text-transform:uppercase}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.pagehead h1{font:600 31px 'Playfair Display',serif;margin:7px 0 5px;color:var(--navy)}.sub{font-size:13px;color:var(--muted)}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;font-size:12px}.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a2433}.btn-dark{background:var(--navy);color:white}.btn-light{background:#f2efe7;color:#455064;border:1px solid var(--line)}.btn-red{background:#fff0ed;color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px 20px;position:relative;overflow:hidden}.stat:after{content:'';position:absolute;width:70px;height:70px;border:1px solid #d6b36a55;border-radius:50%;right:-22px;top:-24px}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:8px;color:var(--navy)}.stat small{font-size:10px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.card{padding:20px;margin-bottom:17px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.card h3{font:600 18px 'Playfair Display',serif;margin:0;color:var(--navy)}.muted{color:var(--muted);font-size:11px}.searchrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.field{width:100%;border:1px solid #ded9ce;background:white;border-radius:9px;padding:11px 12px;color:var(--ink);font-size:12px;outline:none}.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d6b36a22}.search{flex:1;min-width:200px}.select{max-width:180px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;padding:11px 9px;color:#89919c;font-size:9px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0ede6;font-size:11px}tr:last-child td{border-bottom:0}.person{font-weight:700;color:#263449}.subline{font-size:10px;color:var(--muted);margin-top:3px}.pill{border-radius:30px;padding:6px 9px;font-size:9px;font-weight:800;white-space:nowrap;background:#f0eee9;color:#6d7480}.pill.present{background:#e7f4ed;color:var(--green)}.pill.admin{background:#f8efd9;color:#8b682b}.checkbtn{border:0;background:#e8f4ed;color:var(--green);border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800}.undo{background:#f1f0ec;color:#657080}.empty{text-align:center;padding:35px;color:var(--muted);font-size:12px}.progress{height:7px;border-radius:9px;background:#eeeae1;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#b48b45,var(--gold2));border-radius:9px}.activity{display:grid;gap:13px}.activityitem{display:flex;gap:10px;align-items:flex-start}.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:4px;flex:none}.activityitem b{font-size:11px}.activityitem small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}.label{display:block;font-size:10px;color:#697384;margin:0 0 6px;font-weight:700}.hide{display:none!important}.notice{border:1px solid #e8d7ad;background:#fbf6e9;padding:12px 14px;border-radius:10px;color:#6c562b;font-size:11px;line-height:1.6;margin-bottom:15px}.modalback{position:fixed;inset:0;background:#0d1726a8;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:var(--paper);width:min(520px,100%);border-radius:16px;padding:24px;box-shadow:0 25px 90px #0004}.modal h2{font:600 23px 'Playfair Display',serif;margin:0 0 7px}.modal .formgrid{margin:18px 0}.modalactions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:20px;right:22px;background:var(--navy);color:white;padding:13px 17px;border-radius:10px;font-size:12px;z-index:50;box-shadow:var(--shadow)}.auth{min-height:100vh;background:radial-gradient(circle at 75% 15%,#35445b,var(--navy) 55%);display:grid;place-items:center;padding:20px}.authbox{width:min(450px,100%);background:#fffefa;border-radius:18px;padding:30px;box-shadow:0 25px 90px #0005}.authbox .brandmark{color:var(--navy)}.authbox h1{font:600 28px 'Playfair Display',serif;color:var(--navy);margin:25px 0 5px}.authbox p{font-size:12px;color:var(--muted);line-height:1.6}.authbox .field{margin:6px 0 13px}.authbox .btn{width:100%;margin-top:7px}.linkbtn{border:0;background:none;color:#8a682e;font-size:11px;text-decoration:underline;margin-top:13px}.setup{max-width:800px;margin:40px auto;padding:25px}.setup code{background:#f0ede6;padding:2px 5px;border-radius:4px}
@media(max-width:900px){.sidebar{width:68px;padding:20px 8px}.brand{padding:5px 4px 20px}.brandmark{font-size:0}.brandmark:after{content:'AM';font-size:20px}.brand small,.nav button .navlabel,.sidebottom{display:none}.nav button{text-align:center;padding:13px 4px}.nav button span{width:auto}.main{margin-left:68px}.content{padding:23px 18px}.topbar{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.pagehead{align-items:flex-start;flex-direction:column}.pagehead h1{font-size:27px}.content{padding:18px 12px}.topbar{height:62px}.userbox .email{display:none}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.card{padding:15px}}
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="authbox"><div class="brandmark">ACCUEIL MARIAGE</div><p>Chargement de votre espace professionnel…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
let sb=null,user=null,wedding=null,guests=[],members=[],page='dashboard',channel=null,toastTimer;
const cfg=()=>{try{return JSON.parse(localStorage.getItem('am_supabase_config')||'null')}catch{return null}};
function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function configScreen(){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><div class="brandmark">ACCUEIL MARIAGE</div><div class="eyebrow">Installation initiale</div><h1>Connecter votre espace</h1><p>Pour synchroniser les arrivées entre plusieurs téléphones, connectez votre projet Supabase. Les identifiants publics du projet sont enregistrés sur cet appareil.</p><label class="label">URL du projet Supabase</label><input class="field" id="cfgurl" placeholder="https://xxxxxxxx.supabase.co"><label class="label">Clé publique anon / publishable</label><input class="field" id="cfgkey" placeholder="sb_publishable_… ou clé anon" type="password"><button class="btn btn-gold" id="savecfg">Connecter l'application</button><p style="margin-top:16px">Vous n'avez pas encore de projet ? Consultez le guide inclus dans le pack de l'application pour créer gratuitement votre base de données et activer les règles de sécurité.</p></div></div>`;
$('savecfg').onclick=()=>{let url=$('cfgurl').value.trim().replace(/\/$/,''),key=$('cfgkey').value.trim();if(!/^https:\/\/.+\.supabase\.co$/.test(url)||!key){toast('Vérifiez l’URL et la clé.');return}localStorage.setItem('am_supabase_config',JSON.stringify({url,key}));location.reload()}}
function authScreen(msg='Connectez-vous ou créez votre compte administrateur.'){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><div class="brandmark">ACCUEIL MARIAGE</div><div class="eyebrow" style="margin-top:25px">Espace sécurisé</div><h1>Bienvenue</h1><p>${esc(msg)}</p><label class="label">Adresse e-mail</label><input id="email" class="field" type="email" placeholder="vous@exemple.com" autocomplete="username"><label class="label">Mot de passe</label><input id="password" class="field" type="password" placeholder="Au moins 6 caractères" autocomplete="current-password"><button class="btn btn-dark" id="login">Se connecter</button><button class="btn btn-gold" id="signup">Créer mon compte</button><button class="linkbtn" id="reset">Modifier la connexion Supabase</button></div></div>`;
$('login').onclick=()=>authAction('login');$('signup').onclick=()=>authAction('signup');$('reset').onclick=()=>{localStorage.removeItem('am_supabase_config');location.reload()}}
async function authAction(mode){let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){toast('Entrez un e-mail et un mot de passe (6 caractères minimum).');return}try{let r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){toast('Compte créé. Vérifiez votre e-mail puis connectez-vous.');return}user=r.data.user;await boot()}catch(e){toast(e.message)}}
function appShell(){document.getElementById('root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">ACCUEIL MARIAGE</div><small>GUEST MANAGEMENT</small></div><nav class="nav"><button data-page="dashboard" class="active"><span>▦</span><span class="navlabel">Tableau de bord</span></button><button data-page="guests"><span>♙</span><span class="navlabel">Liste des invités</span></button><button data-page="import"><span>⇧</span><span class="navlabel">Importer WhatsApp</span></button><button data-page="team"><span>♧</span><span class="navlabel">Équipe d'accueil</span></button><button data-page="settings"><span>⚙</span><span class="navlabel">Événement</span></button></nav><div class="sidebottom">ACCUEIL MARIAGE<br>Professional Edition<br><span id="sideevent">Espace événement</span></div></aside><section class="main"><header class="topbar"><div class="crumb">ESPACE ÉVÉNEMENT　/　<b id="crumb">Tableau de bord</b></div><div class="userbox"><div class="avatar" id="avatar">A</div><span class="email" id="useremail"></span><button class="btn btn-light" id="logout">Déconnexion</button></div></header><main class="content" id="view"></main></section></div><div id="modalroot"></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('logout').onclick=async()=>{if(channel)await sb.removeChannel(channel);await sb.auth.signOut();user=null;authScreen()};}
async function boot(){try{let {data:{user:u},error}=await sb.auth.getUser();if(error)throw error;if(!u){authScreen();return}user=u;appShell();$('useremail').textContent=user.email;$('avatar').textContent=(user.email||'A')[0].toUpperCase();let {data,error:e}=await sb.from('wedding_members').select('wedding_id,role,weddings(id,name,event_date,venue)').eq('user_id',user.id);if(e)throw e;members=data||[];if(!members.length){newWeddingScreen();return}wedding=members[0].weddings;await refresh();subscribe();go('dashboard')}catch(e){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><h1>Connexion à la base impossible</h1><p>${esc(e.message)}</p><button class="btn btn-dark" onclick="location.reload()">Réessayer</button><button class="linkbtn" onclick="localStorage.removeItem('am_supabase_config');location.reload()">Modifier la configuration</button></div></div>`}}
function newWeddingScreen(){$('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Première configuration</div><h1>Créer votre mariage</h1><div class="sub">Créez l'événement qui accueillera votre liste d'invités.</div></div></div><div class="card" style="max-width:650px"><div class="formgrid"><div class="full"><label class="label">Nom de l'événement *</label><input id="wname" class="field" placeholder="Mariage de … & …"></div><div><label class="label">Date du mariage</label><input id="wdate" type="date" class="field"></div><div><label class="label">Lieu</label><input id="wvenue" class="field" placeholder="Ville, salle…"></div></div><button id="createw" class="btn btn-gold" style="margin-top:16px">Créer mon événement</button></div>`;$('createw').onclick=async()=>{try{let name=$('wname').value.trim();if(!name)throw Error('Donnez un nom à votre événement.');let {data,error}=await sb.rpc('create_wedding',{p_name:name,p_event_date:$('wdate').value||null,p_venue:$('wvenue').value.trim()||null});if(error)throw error;wedding={id:data,name,event_date:$('wdate').value,venue:$('wvenue').value};members=[{wedding_id:data,role:'admin'}];await refresh();subscribe();go('dashboard')}catch(e){toast(e.message)}}}
async function refresh(){let {data,error}=await sb.from('guests').select('*').eq('wedding_id',wedding.id).order('name');if(error)throw error;guests=data||[]}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('wedding-'+wedding.id).on('postgres_changes',{event:'*',schema:'public',table:'guests',filter:'wedding_id=eq.'+wedding.id},async()=>{await refresh();renderPage()}).subscribe()}
const present=()=>guests.filter(g=>g.checked_in_at).length;
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('crumb').textContent=({dashboard:'Tableau de bord',guests:'Liste des invités',import:'Importer WhatsApp',team:'Équipe d’accueil',settings:'Événement'})[p];renderPage()}
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">ACCUEIL MARIAGE / PROFESSIONAL</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function dashboard(){let n=guests.length,a=present(),pct=n?Math.round(a/n*100):0,latest=[...guests].filter(g=>g.checked_in_at).sort((x,y)=>new Date(y.checked_in_at)-new Date(x.checked_in_at)).slice(0,6);return `${head('Tableau de bord',esc(wedding.name||'Votre événement')+' · '+esc(wedding.venue||'Lieu à préciser'))}<div class="stats"><div class="stat"><label>INVITÉS INSCRITS</label><strong>${n}</strong><small>Dans la liste générale</small></div><div class="stat"><label>INVITÉS PRÉSENTS</label><strong style="color:var(--green)">${a}</strong><small>Arrivées confirmées</small></div><div class="stat"><label>ENCORE ATTENDUS</label><strong>${n-a}</strong><small>Non encore enregistrés</small></div><div class="stat"><label>TAUX DE PRÉSENCE</label><strong>${pct}%</strong><small>Sur les invités inscrits</small></div></div><div class="grid2"><div class="card"><div class="cardhead"><div><h3>Suivi des arrivées</h3><div class="muted">Progression de l'accueil en direct</div></div><span class="pill">${pct}%</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="muted">${a} arrivé(s) sur ${n} invité(s)</div><div style="margin-top:20px"><button class="btn btn-dark" onclick="go('guests')">Ouvrir la liste des invités →</button></div></div><div class="card"><div class="cardhead"><h3>Dernières arrivées</h3><span class="muted">En direct</span></div><div class="activity">${latest.length?latest.map(g=>`<div class="activityitem"><span class="dot"></span><div><b>${esc(g.name)}</b><small>${fmt(g.checked_in_at)} · ${esc(g.checked_in_by_email||'Accueil')}</small></div></div>`).join(''):'<div class="empty">Aucune arrivée enregistrée.</div>'}</div></div></div>`}
function guestRows(list){return list.map(g=>`<tr><td><span class="person">${esc(g.name)}</span><div class="subline">${esc(g.phone||'')}</div></td><td>${esc(g.group_name||'—')}</td><td>${esc(g.table_number||'—')}</td><td><span class="pill ${g.checked_in_at?'present':''}">${g.checked_in_at?'✓ PRÉSENT':'EN ATTENTE'}</span>${g.checked_in_at?`<div class="subline">${fmt(g.checked_in_at)}</div>`:''}</td><td>${g.checked_in_at?`<button class="checkbtn undo" data-undo="${g.id}">Annuler</button>`:`<button class="checkbtn" data-checkin="${g.id}">✓ Valider</button>`}</td></tr>`).join('')}
function guestsPage(){return `${head('Liste des invités','Recherchez, filtrez et confirmez les arrivées.','<button class="btn btn-gold" onclick="openGuest()">＋ Ajouter un invité</button>')}<div class="card"><div class="searchrow"><input id="q" class="field search" placeholder="⌕ Rechercher par nom, famille, téléphone…"><select id="statusfilter" class="field select"><option value="all">Tous les statuts</option><option value="waiting">En attente</option><option value="present">Présents</option></select><button class="btn btn-light" onclick="exportCSV()">Exporter CSV</button></div><div class="tablewrap"><table><thead><tr><th>Invité</th><th>Famille / groupe</th><th>Table</th><th>Statut</th><th>Action</th></tr></thead><tbody id="guestrows">${guestRows(guests)}</tbody></table><div id="noresults" class="empty hide">Aucun invité ne correspond à la recherche.</div></div></div>`}
function renderPage(){if(!wedding)return;let v=$('view');if(page==='dashboard')v.innerHTML=dashboard();if(page==='guests'){v.innerHTML=guestsPage();$('q').oninput=filterGuests;$('statusfilter').onchange=filterGuests;$('guestrows').onclick=guestAction}if(page==='import')v.innerHTML=importPage();if(page==='team')v.innerHTML=teamPage();if(page==='settings')v.innerHTML=settingsPage()}
function filterGuests(){let q=$('q').value.toLocaleLowerCase('fr'),f=$('statusfilter').value;let l=guests.filter(g=>(g.name+' '+(g.group_name||'')+' '+(g.phone||'')).toLocaleLowerCase('fr').includes(q)&&(f==='all'||(f==='present'?!!g.checked_in_at:!g.checked_in_at)));$('guestrows').innerHTML=guestRows(l);$('noresults').classList.toggle('hide',l.length>0)}
async function guestAction(e){let id=e.target.dataset.checkin||e.target.dataset.undo;if(!id)return;try{let g=guests.find(x=>x.id===id),check=!!e.target.dataset.checkin;let payload=check?{checked_in_at:new Date().toISOString(),checked_in_by:user.id,checked_in_by_email:user.email}:{checked_in_at:null,checked_in_by:null,checked_in_by_email:null};let {error}=await sb.from('guests').update(payload).eq('id',id).eq('wedding_id',wedding.id);if(error)throw error;await refresh();renderPage();toast(check?'Arrivée confirmée.':'Arrivée annulée.')}catch(e){toast(e.message)}}
function openGuest(g=null){$('modalroot').innerHTML=`<div class="modalback" id="mb"><div class="modal"><h2>${g?'Modifier':'Ajouter'} un invité</h2><p class="muted">Les informations sont partagées avec toute l'équipe.</p><div class="formgrid"><div class="full"><label class="label">Nom et prénom *</label><input id="gn" class="field" value="${esc(g?.name||'')}" placeholder="Ex. Jean Dupont"></div><div><label class="label">Famille / groupe</label><input id="gg" class="field" value="${esc(g?.group_name||'')}" placeholder="Famille du marié"></div><div><label class="label">Téléphone</label><input id="gp" class="field" value="${esc(g?.phone||'')}" placeholder="+237…"></div><div><label class="label">Numéro de table</label><input id="gt" class="field" value="${esc(g?.table_number||'')}" placeholder="Table 4"></div><div><label class="label">Note</label><input id="gno" class="field" value="${esc(g?.notes||'')}" placeholder="Information facultative"></div></div><div class="modalactions"><button class="btn btn-light" onclick="closeModal()">Annuler</button><button class="btn btn-gold" id="saveguest">Enregistrer</button></div></div></div>`;$('mb').onclick=e=>{if(e.target.id==='mb')closeModal()};$('saveguest').onclick=async()=>{try{let name=$('gn').value.trim();if(!name)throw Error('Le nom est obligatoire.');let obj={wedding_id:wedding.id,name,group_name:$('gg').value.trim()||null,phone:$('gp').value.trim()||null,table_number:$('gt').value.trim()||null,notes:$('gno').value.trim()||null};let r=g?await sb.from('guests').update(obj).eq('id',g.id):await sb.from('guests').insert(obj);if(r.error)throw r.error;closeModal();await refresh();renderPage();toast('Invité enregistré.')}catch(e){toast(e.message)}}}
function closeModal(){$('modalroot').innerHTML=''}
function importPage(){return `${head('Importer les invités','Ajoutez en une seule fois les noms copiés depuis WhatsApp.')}<div class="notice"><b>Comment faire ?</b> Dans WhatsApp, sélectionnez et copiez les noms ou exportez la discussion sans médias. Collez ici le texte. L'importation ignore les lignes vides et vous permet de vérifier les noms avant l'ajout.</div><div class="card"><h3>Coller une liste WhatsApp</h3><p class="muted">Un invité par ligne. Vous pouvez aussi coller une liste numérotée ou avec des tirets.</p><textarea id="paste" class="field" rows="9" placeholder="Exemple :&#10;Jean Dupont&#10;Marie et Paul Martin&#10;Famille Nkoudou"></textarea><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-gold" id="preview">Prévisualiser la liste</button><label class="btn btn-light" for="csvfile">Importer un fichier CSV</label><input id="csvfile" type="file" accept=".csv,.txt" class="hide"></div><div id="previewbox"></div></div>`}
function cleanNames(raw){return raw.split(/\r?\n/).map(s=>s.replace(/^\s*(?:[-•*]|\d+[.)-])\s*/,'').replace(/^\[[^\]]+\]\s*/,'').trim()).filter(s=>s.length>1&&!/^(https?:\/\/|message supprimé|image omise|vidéo omise|audio omis)/i.test(s))}
async function bulkInsert(names){let seen=new Set(guests.map(g=>g.name.toLocaleLowerCase('fr'))),unique=[...new Set(names)].filter(n=>!seen.has(n.toLocaleLowerCase('fr')));if(!unique.length){toast('Aucun nouveau nom à importer.');return}let rows=unique.map(name=>({wedding_id:wedding.id,name}));let {error}=await sb.from('guests').insert(rows);if(error)throw error;await refresh();toast(unique.length+' invité(s) importé(s).');go('guests')}
function wireImport(){$('preview').onclick=()=>{let names=cleanNames($('paste').value),box=$('previewbox');box.innerHTML=`<div class="notice" style="margin-top:15px"><b>${names.length} ligne(s) détectée(s)</b><br>${names.slice(0,12).map(esc).join(' · ')}${names.length>12?' …':''}</div><button id="confirmimport" class="btn btn-dark">Confirmer l'importation</button>`;$('confirmimport').onclick=async()=>{try{await bulkInsert(names)}catch(e){toast(e.message)}}};$('csvfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();$('paste').value=t;toast('Fichier chargé. Prévisualisez avant importation.');}}
function teamPage(){let role=members.find(m=>m.wedding_id===wedding.id)?.role||'agent';return `${head('Équipe d’accueil','Invitez les personnes qui contrôleront les entrées.')}<div class="notice">Les agents doivent d'abord créer leur compte ACCUEIL MARIAGE avec leur adresse e-mail. Vous pourrez ensuite les ajouter à cet événement. Seul l'administrateur peut gérer l'équipe.</div><div class="card"><div class="cardhead"><h3>Ajouter un agent</h3><span class="pill ${role==='admin'?'admin':''}">${role==='admin'?'ADMINISTRATEUR':'AGENT'}</span></div><div class="searchrow"><input id="agentemail" class="field search" type="email" placeholder="Adresse e-mail de l'agent"><select id="agentrole" class="field select"><option value="agent">Agent d'accueil</option><option value="admin">Administrateur</option></select><button class="btn btn-gold" id="addagent" ${role!=='admin'?'disabled':''}>Ajouter</button></div><div class="muted">L'ajout par e-mail nécessite que l'agent ait déjà créé son compte.</div></div>`}
function wireTeam(){$('addagent').onclick=async()=>{try{let email=$('agentemail').value.trim();if(!email)throw Error('Saisissez une adresse e-mail.');let {error}=await sb.rpc('add_wedding_member_by_email',{p_wedding_id:wedding.id,p_email:email,p_role:$('agentrole').value});if(error)throw error;toast('Agent ajouté à l’événement.');$('agentemail').value=''}catch(e){toast(e.message)}}}
function settingsPage(){let role=members.find(m=>m.wedding_id===wedding.id)?.role||'agent';return `${head('Paramètres de l’événement','Informations générales et outils de gestion.')}<div class="card"><h3>Informations du mariage</h3><div class="formgrid" style="margin-top:16px"><div class="full"><label class="label">Nom de l'événement</label><input id="setname" class="field" value="${esc(wedding.name||'')}"></div><div><label class="label">Date</label><input id="setdate" type="date" class="field" value="${esc(wedding.event_date||'')}"></div><div><label class="label">Lieu</label><input id="setvenue" class="field" value="${esc(wedding.venue||'')}"></div></div><button id="saveevent" class="btn btn-gold" style="margin-top:14px" ${role!=='admin'?'disabled':''}>Enregistrer les modifications</button></div><div class="card"><h3>Exporter la liste complète</h3><p class="muted">Téléchargez les invités, leur groupe, leur table et leur statut d'arrivée.</p><button class="btn btn-dark" onclick="exportCSV()">Télécharger le fichier CSV</button></div>`}
function wireSettings(){$('saveevent').onclick=async()=>{try{let {error}=await sb.from('weddings').update({name:$('setname').value.trim(),event_date:$('setdate').value||null,venue:$('setvenue').value.trim()||null}).eq('id',wedding.id);if(error)throw error;wedding={...wedding,name:$('setname').value.trim(),event_date:$('setdate').value,venue:$('setvenue').value};toast('Événement mis à jour.');renderPage()}catch(e){toast(e.message)}}}
function exportCSV(){let rows=[['Nom','Groupe','Téléphone','Table','Statut','Date arrivée'],...guests.map(g=>[g.name,g.group_name||'',g.phone||'',g.table_number||'',g.checked_in_at?'Présent':'En attente',g.checked_in_at||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='accueil-mariage-invites.csv';a.click();URL.revokeObjectURL(url)}
function renderPage(){if(!wedding)return;let v=$('view');if(page==='dashboard')v.innerHTML=dashboard();if(page==='guests'){v.innerHTML=guestsPage();$('q').oninput=filterGuests;$('statusfilter').onchange=filterGuests;$('guestrows').onclick=guestAction}if(page==='import'){v.innerHTML=importPage();wireImport()}if(page==='team'){v.innerHTML=teamPage();wireTeam()}if(page==='settings'){v.innerHTML=settingsPage();wireSettings()}}
async function start(){let c=cfg();if(!c){configScreen();return}if(!window.supabase){document.getElementById('root').innerHTML='Impossible de charger le service de connexion. Vérifiez votre connexion internet.';return}sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true},realtime:{params:{eventsPerSecond:10}}});sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){authScreen()}});await boot()}
start();
</script>
</body></html>
