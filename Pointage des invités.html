<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointage des invités</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--tx:#2a2320;--mut:#7a6f68;--ac:#b5586b;--ok:#2e7d4f;--bd:#e8dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#2a2421;--tx:#f3ece6;--mut:#a99d95;--ac:#d9788b;--ok:#5fbf86;--bd:#3d3531}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#2a2421;--tx:#f3ece6;--mut:#a99d95;--ac:#d9788b;--ok:#5fbf86;--bd:#3d3531}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
#title{font-size:20px;font-weight:700;border:0;background:transparent;padding:6px 0;margin-bottom:8px;text-align:center}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--ac)}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
input,textarea{width:100%;padding:13px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-family:inherit}
#q{margin-bottom:10px;border-color:var(--ac)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--bd);font-weight:400;padding:9px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button{font-size:15px;padding:12px 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:400}
button.red{background:#c0392b}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
summary{cursor:pointer;color:var(--mut);font-size:14px}
details input,details textarea{margin-top:10px}
details button{margin-top:10px}
textarea{min-height:90px}
.two{display:flex;gap:8px}
.g{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.g input{width:26px;height:26px;accent-color:var(--ok);flex:none;margin:0}
.g .n{flex:1;font-size:16px}
.g .t{font-size:12px;color:var(--mut);display:block}
.g.ok .nm{color:var(--ok);text-decoration:line-through;opacity:.8}
.x{background:none;color:var(--mut);padding:6px 10px;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:24px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}
.box h2{margin:0 0 4px;font-size:18px}
.box input{margin-top:10px}
.box .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.box .btns button{flex:1}
</style>
</head>
<body>
<div class="wrap">
<input id="title" placeholder="💍 Nom des mariés" aria-label="Titre">
<div class="stats">
<div class="stat"><b id="sTot">0</b><span>Personnes</span></div>
<div class="stat"><b id="sIn">0</b><span>Arrivées</span></div>
<div class="stat"><b id="sLeft">0</b><span>Restantes</span></div>
</div>
<div class="bar"><i id="pg"></i></div>
<input id="q" type="search" placeholder="🔍 Nom ou numéro de table…" autocomplete="off">
<div class="chips">
<button class="chip on" data-f="all">Tous</button>
<button class="chip" data-f="wait">Attendus</button>
<button class="chip" data-f="in">Arrivés</button>
</div>
<details>
<summary>➕ Ajouter des invités</summary>
<input id="nn" placeholder="Nom de l’invité">
<div class="two"><input id="nt" placeholder="Table (ex : 4)"><input id="np" type="number" min="1" value="1" aria-label="Nombre de personnes"></div>
<button id="one">Ajouter</button>
<textarea id="add" placeholder="Ou plusieurs noms, un par ligne" style="margin-top:14px"></textarea>
<button id="addBtn">Ajouter la liste</button>
</details>
<details>
<summary>💬 Importer depuis WhatsApp</summary>
<p style="font-size:13px;color:var(--mut);margin:10px 0 0">Dans WhatsApp, appuyez longuement sur le message contenant la liste, choisissez Copier, puis collez-le ici. Vous pouvez aussi choisir une discussion exportée (.txt) ou des contacts (.vcf).</p>
<textarea id="wa" placeholder="Collez ici le message WhatsApp…"></textarea>
<input id="waf" type="file" accept=".txt,.vcf,text/plain,text/vcard,text/x-vcard">
<button id="waBtn">Importer</button>
<p id="waMsg" style="font-size:14px;color:var(--ok);margin:10px 0 0"></p>
</details>
<div id="list"></div>
<div class="foot">
<button class="ghost" id="exp">Copier la liste</button>
<button class="ghost" id="rst">Tout effacer</button>
</div>
</div>
<div class="md" id="md" hidden><div class="box">
<h2>Modifier l’invité</h2>
<input id="en" placeholder="Nom">
<div class="two"><input id="et" placeholder="Table"><input id="ep" type="number" min="1" aria-label="Nombre de personnes"></div>
<div class="btns"><button id="es">Enregistrer</button><button class="ghost" id="ec">Annuler</button><button class="ghost" id="ed" style="flex-basis:100%">Supprimer</button></div>
</div></div>
<script>
var KEY="invites-mariage",TK="invites-mariage-titre",guests=[],filter="all",editing=-1;
var $=function(i){return document.getElementById(i)};
try{guests=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){guests=[]}
if(!Array.isArray(guests))guests=[];
guests.forEach(function(g){g.table=g.table||"";g.pax=Math.max(1,parseInt(g.pax)||1)});
try{$("title").value=localStorage.getItem(TK)||""}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(guests))}catch(e){}}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function exists(n){return guests.some(function(g){return norm(g.name)===norm(n)})}
function render(){
var q=norm($("q").value.trim()),tot=0,inn=0;
guests.forEach(function(g){tot+=g.pax;if(g.in)inn+=g.pax});
$("sTot").textContent=tot;$("sIn").textContent=inn;$("sLeft").textContent=tot-inn;
$("pg").style.width=(tot?Math.round(inn/tot*100):0)+"%";
var rows=guests.map(function(g,i){return{g:g,i:i}}).filter(function(r){
if(filter==="in"&&!r.g.in)return false;if(filter==="wait"&&r.g.in)return false;
return !q||norm(r.g.name).indexOf(q)>-1||(r.g.table&&norm("table "+r.g.table).indexOf(q)>-1)});
rows.sort(function(a,b){return a.g.name.localeCompare(b.g.name,"fr")});
if(!rows.length){$("list").innerHTML='<div class="empty">'+(guests.length?"Aucun résultat.":"Aucun invité. Ajoutez des noms ci-dessus.")+'</div>';return}
$("list").innerHTML=rows.map(function(r){var g=r.g,sub=[];
if(g.table)sub.push("Table "+esc(g.table));if(g.pax>1)sub.push(g.pax+" pers.");if(g.in)sub.push("arrivé à "+g.at);
return '<div class="g'+(g.in?' ok':'')+'"><input type="checkbox" data-i="'+r.i+'"'+(g.in?' checked':'')+'><div class="n"><span class="nm">'+esc(g.name)+'</span>'+(sub.length?'<span class="t">'+sub.join(" · ")+'</span>':'')+'</div><button class="x" data-e="'+r.i+'" aria-label="Modifier">✎</button></div>'}).join("");
}
$("list").addEventListener("change",function(e){var i=e.target.getAttribute("data-i");if(i===null)return;
var g=guests[i];g.in=e.target.checked;g.at=g.in?new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";save();render()});
$("list").addEventListener("click",function(e){var i=e.target.getAttribute("data-e");if(i===null)return;
editing=+i;var g=guests[i];$("en").value=g.name;$("et").value=g.table;$("ep").value=g.pax;
$("ed").textContent="Supprimer";$("md").hidden=false});
$("ec").onclick=function(){$("md").hidden=true};
$("es").onclick=function(){var n=$("en").value.trim();if(!n)return;var g=guests[editing];
g.name=n;g.table=$("et").value.trim();g.pax=Math.max(1,parseInt($("ep").value)||1);save();render();$("md").hidden=true};
$("ed").onclick=function(){if($("ed").textContent==="Supprimer"){$("ed").textContent="Confirmer la suppression";return}
guests.splice(editing,1);save();render();$("md").hidden=true};
function addNames(arr){arr.forEach(function(n){if(n&&!exists(n))guests.push({name:n,table:"",pax:1,in:false,at:""})});save();render()}
$("one").onclick=function(){var n=$("nn").value.trim();if(!n||exists(n))return;
guests.push({name:n,table:$("nt").value.trim(),pax:Math.max(1,parseInt($("np").value)||1),in:false,at:""});
$("nn").value="";$("nt").value="";$("np").value=1;save();render()};
$("addBtn").onclick=function(){addNames($("add").value.split("\n").map(function(s){return s.trim()}));$("add").value=""};
function cleanLine(l){
var ts=/^\u200e?\[?\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}[:.]\d{2}(:\d{2})?(\s?[APap]\.?[Mm]\.?)?\]?\s*[-–]?\s*/;
if(ts.test(l)){l=l.replace(ts,"");if(/^[^:]{1,40}:\s/.test(l))l=l.replace(/^[^:]{1,40}:\s*/,"");else return ""}
if(/<.*(omis|omitted|média|media).*>|chiffr|encrypted|https?:\/\//i.test(l))return "";
l=l.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u200e]/gu,"").replace(/\+?\d[\d\s().-]{6,}\d/g,"").replace(/[*_~]/g,"").replace(/^[\s\d]*[.):\-–—•]+\s*/,"");
return l.replace(/\s+/g," ").trim()}
function importText(t,vcf){
var lines=t.split(/\r?\n/);
if(vcf)lines=lines.filter(function(l){return /^FN[:;]/i.test(l)}).map(function(l){return l.replace(/^FN[^:]*:/i,"")});
var add=0,dup=0;
lines.forEach(function(l){var n=vcf?l.trim():cleanLine(l);
if(n.length<2||!/[A-Za-zÀ-ÿ]/.test(n))return;
if(exists(n)){dup++;return}guests.push({name:n,table:"",pax:1,in:false,at:""});add++});
save();render();
$("waMsg").textContent=add+" invité(s) ajouté(s)"+(dup?", "+dup+" déjà présent(s)":"")+"."}
$("waBtn").onclick=function(){var f=$("waf").files[0];
if(f){var r=new FileReader();r.onload=function(){importText(String(r.result),/\.vcf$/i.test(f.name));$("waf").value=""};r.readAsText(f)}
else if($("wa").value.trim()){importText($("wa").value,false);$("wa").value=""}
else $("waMsg").textContent="Collez un texte ou choisissez un fichier."};
$("q").oninput=render;
$("title").oninput=function(){try{localStorage.setItem(TK,$("title").value)}catch(e){}};
document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){filter=b.getAttribute("data-f");
document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});render()}});
$("exp").onclick=function(){var t="Nom;Table;Personnes;Arrivé\n"+guests.map(function(g){return [g.name,g.table,g.pax,g.in?g.at:"non"].join(";")}).join("\n");
try{navigator.clipboard.writeText(t);$("exp").textContent="Copié ✓"}catch(e){$("exp").textContent="Non disponible"}
setTimeout(function(){$("exp").textContent="Copier la liste"},1500)};
$("rst").onclick=function(){if($("rst").textContent!=="Confirmer ?"){$("rst").textContent="Confirmer ?";setTimeout(function(){$("rst").textContent="Tout effacer"},3000);return}
guests=[];save();render();$("rst").textContent="Tout effacer"};
render();
</script>
</body>
</html>
